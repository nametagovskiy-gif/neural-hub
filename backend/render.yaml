services:
  - type: web
    name: neural-hub-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGINS
        value: https://nametagovskiy-gif.github.io
      - key: DATABASE_URL
        sync: false
      - key: PROVIDERS_JSON
        sync: false
